services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finhub
      POSTGRES_DB: finhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finhub -d finhub']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: finhub:latest
    restart: unless-stopped
    # .env is optional here; POSTGRES_PASSWORD is also read from it for interpolation below.
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides any DATABASE_URL in .env (which targets localhost). URL-encode special characters in the password.
      DATABASE_URL: postgres://finhub:${POSTGRES_PASSWORD}@db:5432/finhub
      ROLE: all
      PORT: '3000'
      # true = seed fake demo data once at startup (no-op if the demo workspace already has accounts)
      DEMO_SEED: ${DEMO_SEED:-false}
      # Optional shared-password gate (HTTP Basic) for a public demo; empty = off. Not real auth.
      FINHUB_ACCESS_PASSWORD: ${FINHUB_ACCESS_PASSWORD:-}
      FINHUB_ACCESS_USER: ${FINHUB_ACCESS_USER:-demo}
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
