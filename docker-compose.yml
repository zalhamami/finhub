# The `app` service arrives with the Dockerfile in a later session.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: finhub
      POSTGRES_DB: finhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U finhub -d finhub']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
